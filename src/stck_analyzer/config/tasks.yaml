collect_task:
  description: >
    Today's date is {today}. Use the Get Stock Data tool as the sole source
    of stock price and news data for {ticker}. Do not use background knowledge
    about the company or market. Return the data the tool provides; if something
    is unavailable, write "not in the data" rather than guessing.
  expected_output: >
    Price data and news headlines from the tool, including available publication
    dates and links.
  agent: collector

summarize_task:
  description: >
    Today's date is {today}. Review the previous task output and create exactly
    5 bullet points using ONLY information in that output. Do not use your own
    background knowledge about the company or market. Cite news claims with
    their headline and publication date, including the link when available. If
    something is not in the data, write "not in the data" instead of guessing.
    If news is limited, say so and summarize only the price movement.
  expected_output: >
    Exactly 5 bullet points summarizing the provided information, with
    headlines and dates cited for news claims, with links when available.
  agent: summarizer

risk_task:
  description: >
    Today's date is {today}. Use ONLY information in the previous task output.
    Identify risks supported by the provided headlines and cite the supporting
    headline and publication date for each, including the link when available.
    Do not use background knowledge or guess. If a risk is not supported by a
    headline, do not include it. If something is not in the data, say
    "not in the data".
  expected_output: >
    3-5 supported risks, each followed by the supporting headline and date, and
    link when available. Discard any risk with no supporting headline. If fewer
    than 3 risks are supported by the available headlines, state that rather
    than inventing risks.
  agent: risk_checker

brief_task:
  description: >
    Today's date is {today}. Write a 6-8 line daily brief for {ticker} using
    ONLY information in the previous task outputs. Do not use background
    knowledge about the company or market. Cite news claims with their headline
    and publication date; include the link when available. If something is not
    in the data, say "not in the data" rather than guessing.
    Structure: What changed today / Why it matters / What to watch.
  expected_output: >
    A 6-8 line daily brief formatted as markdown without code fences, with
    citations for news claims and no unsupported claims.
  agent: brief_writer