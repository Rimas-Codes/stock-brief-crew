name: Daily stock brief

on:
  schedule:
    - cron: "0 22 * * 1-5"   # 22:00 UTC, Mon-Fri
  workflow_dispatch:          # lets you run it manually to test

permissions:
  contents: write             # needed to commit the brief

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Generate brief
        env:
          MODEL: groq/openai/gpt-oss-120b
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CREWAI_TRACING_ENABLED: "false"
        run: python -m stck_analyzer.main NVDA

      - name: Commit brief
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git status --short
          git add briefs/ data/
          git commit -m "Add daily brief and forecast log $(date -u +%F)" || echo "Nothing to commit"
          git push